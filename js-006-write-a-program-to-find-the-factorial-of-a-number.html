<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a program to find the factorial of a number.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Write a program to find the factorial of a number.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><input id="n" type="number" value="5"><button onclick="let f=1;for(let i=2;i<=n.value;i++)f*=i;out.textContent=f">Factorial</button><div id="out" class="result"></div></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
