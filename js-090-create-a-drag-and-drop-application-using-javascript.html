<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a drag-and-drop application using JavaScript.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Create a drag-and-drop application using JavaScript.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><div id="drag" draggable="true" style="padding:20px;background:#c7d2fe">Drag me</div><div id="drop" style="padding:30px;border:2px dashed #4338ca">Drop here</div><script>drag.ondragstart=e=>e.dataTransfer.setData("x","1");drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();drop.textContent="Dropped!"}</script></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
