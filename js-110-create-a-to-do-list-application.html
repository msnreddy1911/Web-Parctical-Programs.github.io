<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a to-do list application.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Create a to-do list application.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><input id="task" placeholder="Task"><button onclick="if(task.value){let li=document.createElement('li');li.textContent=task.value;li.onclick=()=>li.remove();list.append(li);task.value=''}">Add</button><ul id="list"></ul></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
