<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a number guessing game.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Create a number guessing game.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><input id="g" type="number"><button onclick="out.textContent=(+g.value===secret?'Correct!':+g.value<secret?'Too low':'Too high')">Guess</button><div id="out" class="result"></div><script>let secret=Math.floor(Math.random()*10)+1</script></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
