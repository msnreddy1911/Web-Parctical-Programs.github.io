<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a program to check whether a number is even or odd.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Write a program to check whether a number is even or odd.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><input id="n" type="number"><button onclick="out.textContent=n.value%2===0?'Even':'Odd'">Check</button><div id="out" class="result"></div></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
