<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Display API data dynamically on a webpage.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Display API data dynamically on a webpage.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><button onclick="load()">Fetch API</button><pre id="out" class="result"></pre><script>async function load(){try{let r=await fetch("https://jsonplaceholder.typicode.com/todos/1");out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent="Network request unavailable."}}</script></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
