<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a countdown timer using JavaScript.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Create a countdown timer using JavaScript.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><input id="n" value="10"><button onclick="go()">Start</button><h2 id="out">10</h2><script>function go(){let x=+n.value;out.textContent=x;let id=setInterval(()=>{out.textContent=--x;if(x<=0)clearInterval(id)},1000)}</script></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
