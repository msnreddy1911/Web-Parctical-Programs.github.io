<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write a program to generate the Fibonacci series.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Write a program to generate the Fibonacci series.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><input id="n" value="8"><button onclick="let a=0,b=1,s=[];for(let i=0;i<n.value;i++){s.push(a);[a,b]=[b,a+b]}out.textContent=s.join(', ')">Generate</button><div id="out" class="result"></div></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
