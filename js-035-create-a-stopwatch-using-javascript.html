<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a stopwatch using JavaScript.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Create a stopwatch using JavaScript.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><h2 id="clock">0.0 s</h2><button onclick="start()">Start</button> <button onclick="stop()">Stop</button> <button onclick="reset()">Reset</button><script>let s=0,id;function start(){if(!id){let t=Date.now()-s;id=setInterval(()=>{s=Date.now()-t;clock.textContent=(s/1000).toFixed(1)+" s"},100)}}function stop(){clearInterval(id);id=null}function reset(){stop();s=0;clock.textContent="0.0 s"}</script></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
