<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a tic-tac-toe game.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Create a tic-tac-toe game.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><div id="b" style="display:grid;grid-template-columns:repeat(3,70px);gap:5px"></div><script>let turn="X";for(let i=0;i<9;i++){let q=document.createElement("button");q.style.height="70px";q.onclick=()=>{if(!q.textContent){q.textContent=turn;turn=turn==="X"?"O":"X"}};b.append(q)}</script></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
