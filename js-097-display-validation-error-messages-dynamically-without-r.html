<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Display validation error messages dynamically without reloading the page.</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav class="topbar"><b>Web Practical Lab</b><span><a href="../index.html">Home</a><a href="index.html">Program List</a></span></nav><main class="container"><h1>Display validation error messages dynamically without reloading the page.</h1><p>Practical experiment from the supplied assignment list.</p><div class="demo"><form onsubmit="event.preventDefault();out.textContent=this.checkValidity()?'Valid':'Please fill required fields'"><input required placeholder="Name"><input required type="email" placeholder="Email"><input required minlength="6" type="password" placeholder="Password"><button>Validate</button></form><div id="out" class="result"></div></div></main><footer>HTML, CSS & JavaScript Practical Lab</footer></body></html>
